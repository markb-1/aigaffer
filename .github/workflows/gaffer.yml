name: gaffer

on:
  schedule:
    # Every three hours; seven past, off the on-the-hour crush. The deadline
    # window is the last three hours before the deadline, so one tick lands
    # in it — after the press conferences, which is the whole point of the
    # deadline report. GitHub drops scheduled runs under load, and a missed
    # tick costs that week's deadline report, which is the price of reporting
    # on team news that exists rather than team news that does not.
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "which report to run"
        type: choice
        default: auto
        options:
          - auto
          - scout
          - deadline

permissions:
  contents: write

# One gaffer at a time: overlapping runs would race the state commit.
# Never cancel a run in flight — it may already have sent a report.
concurrency:
  group: gaffer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The solver's half is a couple of hundred API calls and a handful of MILP
    # solves: minutes, not tens of them. The manager's half is up to twelve
    # unstreamed turns of an agent that searches the web between them, and
    # twelve slow ones do not fit inside twenty minutes — a cap that cuts off a
    # conversation we have already paid for is worse than one that never fires.
    # Thirty is still a sixth of the three hours to the next tick, so the
    # concurrency group is never the thing at risk.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install .
      - run: python -m aigaffer ${{ github.event.inputs.mode || 'auto' }}
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The manager. An unset secret arrives here as the empty string,
          # which Config reads as no key at all, and the run is the Phase 1
          # one: a report, a little worse, on time.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Set deliberately rather than left unset, so that the run has asked
          # for a manager: a run that asked and has no key to reach him with
          # says so on the log, and a missing secret looks like something
          # rather than like nothing. The kill switch is a repository variable
          # of the same name set to 0 — no edit to this file, no lost report.
          AIGAFFER_MANAGER: ${{ vars.AIGAFFER_MANAGER || '1' }}
          # The planner, and the same arrangement: set deliberately so that a
          # run has asked for the window, with a repository variable of the
          # same name set to 'single' as the kill switch. A week the window
          # misbehaves is a week the single-week solver reports on time, and
          # neither answer needs a commit to this file.
          AIGAFFER_PLANNER: ${{ vars.AIGAFFER_PLANNER || 'multi' }}
          # The chip planner, same arrangement again: on by default, with a
          # repository variable of the same name set to 'off' as the kill
          # switch. Off makes chips advisory only — Phase 2.5's behaviour — and
          # is one variable to set, not a commit to this file.
          AIGAFFER_CHIPS: ${{ vars.AIGAFFER_CHIPS || 'on' }}
      - name: Commit state
        # Even when the run failed: it may have sent a report before it died,
        # and a report that went out but was never recorded is one the next
        # tick sends again.
        if: always()
        run: |
          git config user.name "aigaffer-bot"
          git config user.email "bot@aigaffer.local"
          git add state/
          # The root GW*.md files too — the polished verdicts the homepage
          # shows. Conditionally, because this step runs even after a run
          # that died before writing one, and on a first failure like that
          # the glob matches nothing, which `git add GW*.md` treats as an
          # error and would fail the step over.
          if compgen -G "GW*.md" > /dev/null; then
            git add GW*.md
          fi
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: gaffer run $(date -u +%FT%H:%M)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
