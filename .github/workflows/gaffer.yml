name: gaffer

on:
  schedule:
    # Every thirty minutes; seven past and thirty-seven past, off the
    # on-the-hour crush. The report windows are ninety minutes wide, so a
    # half-hour tick puts three chances inside each one and GitHub can drop
    # two of them — under load it does drop scheduled runs, and a missed
    # tick used to cost the week's report outright. Ticking this often is
    # only affordable because of the gate below: a tick nowhere near a
    # window costs one curl, not a pip install.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "which report to run"
        type: choice
        default: auto
        options:
          - auto
          - scout
          - deadline
          - reminder

permissions:
  contents: write

# One gaffer at a time: overlapping runs would race the state commit.
# Never cancel a run in flight — it may already have sent a report. A tick
# that lands while a long manager run is still going simply queues behind it,
# and its own gate decides afresh when it starts.
concurrency:
  group: gaffer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The solver's half is a couple of hundred API calls and a handful of MILP
    # solves: minutes, not tens of them. The manager's half is up to twelve
    # unstreamed turns of an agent that searches the web between them, and
    # twelve slow ones do not fit inside twenty minutes — a cap that cuts off a
    # conversation we have already paid for is worse than one that never fires.
    timeout-minutes: 30
    steps:
      # The gate, before the checkout and everything else. The schedule ticks
      # every thirty minutes and Python is the authority on the windows, but
      # asking Python costs a checkout, a toolchain and a pip install —
      # minutes of billed runner for the "stand down" answer the tick gets
      # almost every time. So the first step asks the same question crudely,
      # with the curl and jq the runner already has: how long to the next
      # deadline, and is that anywhere near a report window? "Near" is a
      # generous superset of the Python windows on purpose — the gate exists
      # to make a no-op tick cost five seconds, never to decide that a report
      # does not run; every real decision still belongs to decide_mode.
      #
      # A manual dispatch bypasses the gate entirely: a person clicking the
      # button has already decided the run should happen, and the mode input
      # would be meaningless behind a clock check.
      #
      # The gate fails open. If curl cannot reach the API, or jq cannot find
      # a future deadline in what came back, run=true stands: a wasted pip
      # install costs cents, a missed deadline report costs the gameweek.
      # (Off-season ticks therefore run and stand down in Python — the same
      # money the old three-hour schedule spent all year round.)
      - name: Ask the clock whether this tick could matter
        id: gate
        env:
          GH_EVENT: ${{ github.event_name }}
        run: |
          if [ "$GH_EVENT" != "schedule" ]; then
            echo "dispatched by hand — the gate stands aside"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=true
          # The next deadline still ahead of us, as epoch seconds. jq's
          # fromdate reads the API's "2025-08-22T17:30:00Z" directly; the
          # `?` swallows any row it cannot parse rather than failing the
          # whole expression, and `min` of what is left is the one we face.
          next=$(curl -sf --max-time 30 https://fantasy.premierleague.com/api/bootstrap-static/ \
            | jq -r '[.events[].deadline_time // empty | fromdate? | select(. > now)] | min // empty') \
            || next=""
          if [ -n "$next" ]; then
            secs=$(( next - $(date -u +%s) ))
            # The supersets, in seconds to the deadline. Python's windows are
            # reminder 1.5-3h, deadline 22.5-24h, scout 36-60h; each gets
            # hours of slack on both sides so that clock skew, a slow queue
            # or a retuned constant in config can never make the gate starve
            # a window it did not know had moved.
            run=false
            if [ "$secs" -ge 0      ] && [ "$secs" -le 18000  ]; then run=true; fi  # reminder: 0-5h
            if [ "$secs" -ge 72000  ] && [ "$secs" -le 93600  ]; then run=true; fi  # deadline: 20-26h
            if [ "$secs" -ge 122400 ] && [ "$secs" -le 223200 ]; then run=true; fi  # scout: 34-62h
            echo "next deadline in ${secs}s — run=$run"
          else
            echo "no deadline found (curl or jq came up empty) — failing open"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: { python-version: "3.12" }
      - run: pip install .
        if: steps.gate.outputs.run == 'true'
      - run: python -m aigaffer ${{ github.event.inputs.mode || 'auto' }}
        if: steps.gate.outputs.run == 'true'
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The manager. An unset secret arrives here as the empty string,
          # which Config reads as no key at all, and the run is the Phase 1
          # one: a report, a little worse, on time.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Set deliberately rather than left unset, so that the run has asked
          # for a manager: a run that asked and has no key to reach him with
          # says so on the log, and a missing secret looks like something
          # rather than like nothing. The kill switch is a repository variable
          # of the same name set to 0 — no edit to this file, no lost report.
          AIGAFFER_MANAGER: ${{ vars.AIGAFFER_MANAGER || '1' }}
          # The planner, and the same arrangement: set deliberately so that a
          # run has asked for the window, with a repository variable of the
          # same name set to 'single' as the kill switch. A week the window
          # misbehaves is a week the single-week solver reports on time, and
          # neither answer needs a commit to this file.
          AIGAFFER_PLANNER: ${{ vars.AIGAFFER_PLANNER || 'multi' }}
          # The chip planner, same arrangement again: on by default, with a
          # repository variable of the same name set to 'off' as the kill
          # switch. Off makes chips advisory only — Phase 2.5's behaviour — and
          # is one variable to set, not a commit to this file.
          AIGAFFER_CHIPS: ${{ vars.AIGAFFER_CHIPS || 'on' }}
      - name: Commit state
        # Even when the run failed: it may have sent a report before it died,
        # and a report that went out but was never recorded is one the next
        # tick sends again. Only behind the gate, though — a gated-out tick
        # checked nothing out and has nothing to commit.
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "aigaffer-bot"
          git config user.email "bot@aigaffer.local"
          git add state/
          # The root GW*.md files too — the polished verdicts the homepage
          # shows. Conditionally, because this step runs even after a run
          # that died before writing one, and on a first failure like that
          # the glob matches nothing, which `git add GW*.md` treats as an
          # error and would fail the step over.
          if compgen -G "GW*.md" > /dev/null; then
            git add GW*.md
          fi
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: gaffer run $(date -u +%FT%H:%M)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
