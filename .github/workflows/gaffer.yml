name: gaffer

on:
  schedule:
    # Every three hours; seven past, off the on-the-hour crush. The deadline
    # window is the last three hours before the deadline, so one tick lands
    # in it — after the press conferences, which is the whole point of the
    # deadline report. GitHub drops scheduled runs under load, and a missed
    # tick costs that week's deadline report, which is the price of reporting
    # on team news that exists rather than team news that does not.
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "which report to run"
        type: choice
        default: auto
        options:
          - auto
          - scout
          - deadline

permissions:
  contents: write

# One gaffer at a time: overlapping runs would race the state commit.
# Never cancel a run in flight — it may already have sent a report.
concurrency:
  group: gaffer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A run is a couple of hundred API calls and a handful of MILP solves:
    # minutes, not tens of them. A job still going after twenty is stuck, and
    # it holds the concurrency group against every tick behind it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install .
      - run: python -m aigaffer ${{ github.event.inputs.mode || 'auto' }}
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit state
        # Even when the run failed: it may have sent a report before it died,
        # and a report that went out but was never recorded is one the next
        # tick sends again.
        if: always()
        run: |
          git config user.name "aigaffer-bot"
          git config user.email "bot@aigaffer.local"
          git add state/
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: gaffer run $(date -u +%FT%H:%M)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
