name: gaffer

on:
  schedule:
    # Every three hours, so the six-hour deadline window gets two ticks and a
    # dropped one costs nothing; seven past, off the on-the-hour crush. The
    # store makes the second tick a no-op.
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "which report to run"
        type: choice
        default: auto
        options:
          - auto
          - scout
          - deadline

permissions:
  contents: write

# One gaffer at a time: overlapping runs would race the state commit.
# Never cancel a run in flight — it may already have sent a report.
concurrency:
  group: gaffer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install .
      - run: python -m aigaffer ${{ github.event.inputs.mode || 'auto' }}
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit state
        run: |
          git config user.name "aigaffer-bot"
          git config user.email "bot@aigaffer.local"
          git add state/
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: gaffer run $(date -u +%FT%H:%M)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
