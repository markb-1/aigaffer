[project]
name = "aigaffer"
version = "0.1.0"
description = "Autonomous AI manager for Fantasy Premier League"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pulp>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aigaffer*"]
