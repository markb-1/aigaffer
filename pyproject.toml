[project]
name = "aigaffer"
version = "0.1.0"
description = "Autonomous AI manager for Fantasy Premier League"
requires-python = ">=3.12"
# Upper bounds on the majors: this bot runs unattended on a schedule, and a
# breaking release picked up by a fresh `pip install .` in CI would first be
# noticed as a missing report.
# anthropic 1.x is the first stable SDK major and 0.x is a different client
# shape, so on that one the floor matters as much as the ceiling.
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "pulp>=3.3,<4", "anthropic>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aigaffer*"]

[tool.pytest.ini_options]
# The solver is run a few hundred times across the suite and PuLP warns on
# every construction of its bundled CBC binding, which buried the output under
# 181 warnings — the number that makes a real one invisible. Matched on the
# message, so it silences that one deprecation and nothing else: a different
# PuLP warning, or this one changing its wording after an upgrade, comes
# straight back. The upgrade it is asking for (`pulp[cbc]` and COIN_CMD) is a
# dependency change, not a test change, and is not this commit's to make.
#
# Discovery is untouched: no testpaths, no python_files, no import mode. The
# section only exists to hold this line.
filterwarnings = [
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
]
